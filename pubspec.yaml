name: otej_link
description: Application mobile offline-first connectant les jeunes algériens aux opportunités ODEJ.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database (offline-first)
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.1

  # Preferences
  shared_preferences: ^2.3.5

  # Network / backend
  supabase_flutter: ^2.9.1

  # Map (OpenStreetMap, no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Images
  cached_network_image: ^3.4.1

  # Liens externes (téléphone, email)
  url_launcher: ^6.3.1

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (Riverpod + drift)
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
  generate: true
